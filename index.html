<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Residents Directory V4.0</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-main">
      <div class="brand">Residents Directory <small>V4.0</small></div>

      <input id="search" class="search" type="search" placeholder="Search residents…" autocomplete="off" aria-label="Search residents" />
    </div>

    <div id="status" class="status" role="status" aria-live="polite">
      <span id="statusText" class="status-text"></span>
      <button id="villageMapBtn" class="install-button" type="button">Village Map</button>
      <span id="dataUpdated" class="updated-note hidden"></span>
    </div>

    <div class="topbar-actions">
      <button id="installBtn" class="install-button" type="button">
        Add to Home Screen
      </button>
      <span id="connectionStatus" class="connection-status hidden" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main class="container">
    <ul id="list" class="list" aria-label="Residents"></ul>
  </main>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle" aria-describedby="modalSub">
    <div class="modal-inner">
      <button id="closeBtn" class="icon-btn" aria-label="Close">✕</button>
      <div class="profile-details">
      <img id="modalPhoto" class="modal-photo" alt="" />
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalSub" class="modal-sub"></div>
      <div id="modalMeta" class="modal-meta"></div>
      </div>
      <div class="profile-footer">
      <div class="modal-actions">
        <a id="textBtn" class="btn" href="#"><span aria-hidden="true">💬</span></a>
        <a id="callBtn" class="btn" href="#" title="Phone call" aria-label="Phone call"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg></a>
        <a id="videoBtn" class="btn" href="#" target="_blank" rel="noopener noreferrer" title="Open WhatsApp, then tap its video camera" aria-label="Open WhatsApp for a video call" aria-describedby="videoHint"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="13" height="14" rx="2"/><path d="m15 10 7-4v12l-7-4Z"/></svg></a>
        <a id="emailBtn" class="btn" href="#"><span aria-hidden="true">📩</span></a>
        <button id="mapBtn" class="btn" type="button" title="Map" aria-label="Show resident on village map"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 6-3 6 3 6-3v12l-6 3-6-3-6 3Z"/><path d="M9 12v7m6-6v9"/><path d="M16 5c0 3-4 7-4 7S8 8 8 5a4 4 0 0 1 8 0Z"/><circle cx="12" cy="5" r="1"/></svg></button>
      </div>
      <p id="videoHint" class="video-hint">For video, the camera button <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:middle" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" role="img" aria-label="video camera"><rect x="2" y="5" width="13" height="14" rx="2"/><path d="m15 10 7-4v12l-7-4Z"/></svg> will open WhatsApp with the resident you selected. Then, tap the video call icon <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:middle" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" role="img" aria-label="video camera"><rect x="2" y="5" width="13" height="14" rx="2"/><path d="m15 10 7-4v12l-7-4Z"/></svg> located at the top right side.</p>
      </div>
    </div>
  </dialog>

  <div id="updateNotice" class="update-notice hidden" role="status" aria-live="polite">
    <span>New version ready</span>
    <button id="reloadAppBtn" type="button">Reload</button>
  </div>

  <div id="cardNavigation" aria-label="Card navigation">
  <button id="pageUp" type="button" aria-label="Go up one page" title="Go up one page">Up</button>
  <button id="pageDown" type="button" aria-label="Go down one page" title="Go down one page">Down</button>
  <button id="backToTop" type="button" aria-label="Back to top of cards" title="Back to top of cards">Top</button>
  <button id="goToBottom" type="button" aria-label="Go to bottom of cards" title="Go to bottom of cards">Bot</button>
  </div>

  <dialog id="villageMap" class="village-map" aria-labelledby="mapTitle">
    <div class="map-heading"><h2 id="mapTitle">Natura Village Map</h2><button id="closeMap" type="button">Close map</button></div>
    <label for="mapSearch">Find a resident, house number or address</label>
    <input id="mapSearch" type="search" placeholder="Name, house number or street…" autocomplete="off" />
    <div id="mapResults" class="map-results" aria-label="Search results"></div>
    <div class="map-tools"><button id="mapZoomIn" type="button" aria-label="Zoom in">+</button><button id="mapZoomOut" type="button" aria-label="Zoom out">−</button><button id="mapFit" type="button">Show whole village</button></div>
    <p id="mapStatus" role="status">Loading village map…</p>
    <div id="mapViewport" class="map-viewport" tabindex="0" aria-label="Village map. Use arrow keys to pan; scroll wheel, plus and minus to zoom.">
      <svg id="mapSvg" viewBox="0 0 1600 1600" role="group" aria-label="Clickable village houses"><image href="maps/natura-site-map.jpg" width="1600" height="1600" /></svg>
    </div>
    <section id="mapHousehold" class="map-household" aria-live="polite"></section>
  </dialog>
  <script src="app.js"></script>
  <script src="map.js"></script>
</body>
</html>
