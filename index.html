<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Residents Directory</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-main">
      <div class="brand">Residents Directory</div>

      <input id="search" class="search" type="search" placeholder="Search residents…" autocomplete="off" aria-label="Search residents" />
    </div>

    <div id="status" class="status" role="status" aria-live="polite">
      <span id="statusText" class="status-text"></span>
      <span id="dataUpdated" class="updated-note hidden"></span>
    </div>

    <div class="topbar-actions">
      <button id="villageMapBtn" class="install-button" type="button">Village Map</button>
      <button id="installBtn" class="install-button" type="button">
        Add to Home Screen
      </button>
      <span id="connectionStatus" class="connection-status hidden" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main class="container">
    <ul id="list" class="list" aria-label="Residents"></ul>
  </main>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle" aria-describedby="modalSub">
    <div class="modal-inner">
      <button id="closeBtn" class="icon-btn" aria-label="Close">✕</button>
      <img id="modalPhoto" class="modal-photo" alt="" />
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalSub" class="modal-sub"></div>
      <div class="modal-actions">
        <a id="textBtn" class="btn" href="#">Text</a>
        <a id="callBtn" class="btn" href="#">Call</a>
        <a id="emailBtn" class="btn" href="#">Email</a>
        <button id="mapBtn" class="btn" type="button">Map</button>
      </div>
      <div id="modalMeta" class="modal-meta"></div>
    </div>
  </dialog>

  <div id="updateNotice" class="update-notice hidden" role="status" aria-live="polite">
    <span>New version ready</span>
    <button id="reloadAppBtn" type="button">Reload</button>
  </div>

  <div id="cardNavigation" aria-label="Card navigation">
  <button id="pageUp" type="button" aria-label="Go up one page" title="Go up one page">Up</button>
  <button id="pageDown" type="button" aria-label="Go down one page" title="Go down one page">Down</button>
  <button id="backToTop" type="button" aria-label="Back to top of cards" title="Back to top of cards">Top</button>
  <button id="goToBottom" type="button" aria-label="Go to bottom of cards" title="Go to bottom of cards">Bot</button>
  </div>

  <dialog id="villageMap" class="village-map" aria-labelledby="mapTitle">
    <div class="map-heading"><h2 id="mapTitle">Natura Village Map</h2><button id="closeMap" type="button">Close map</button></div>
    <label for="mapSearch">Find a resident, house number or address</label>
    <input id="mapSearch" type="search" placeholder="Name, house number or street…" autocomplete="off" />
    <div id="mapResults" class="map-results" aria-label="Search results"></div>
    <div class="map-tools"><button id="mapZoomIn" type="button" aria-label="Zoom in">+</button><button id="mapZoomOut" type="button" aria-label="Zoom out">−</button><button id="mapFit" type="button">Show whole village</button></div>
    <p id="mapStatus" role="status">Loading village map…</p>
    <div id="mapViewport" class="map-viewport" tabindex="0" aria-label="Village map. Use arrow keys to pan; scroll wheel, plus and minus to zoom.">
      <svg id="mapSvg" viewBox="0 0 1600 1600" role="group" aria-label="Clickable village houses"><image href="maps/natura-site-map.jpg" width="1600" height="1600" /></svg>
    </div>
    <section id="mapHousehold" class="map-household" aria-live="polite"></section>
  </dialog>
  <script src="app.js"></script>
  <script src="map.js"></script>
</body>
</html>
